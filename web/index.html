<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artificer老王的学习笔记</title>
    <link rel="icon" type="image/jpeg" href="./images/site-logo.jpg" />
    <link rel="stylesheet" href="./style/main.css?v=20260731f">
    <link rel="stylesheet" href="./style/article.css?v=20260731a">
</head>

<body>
    <div id="app"></div>

    <!-- Vue 编译用模板：避免 mount 时清空 #app 导致导航消失 -->
    <template id="vue-app-template">
        <div class="site" :class="{ 'site--article': view === 'article' }">
            <header class="site-header">
                <div class="site-header__inner">
                    <a class="site-brand" href="#/" @click.prevent="goHome">
                        <img class="site-brand__logo" src="./images/site-logo.jpg" alt="Artificer老王的学习笔记" decoding="async" />
                        Artificer老王的学习笔记
                    </a>

                    <nav class="site-tabs" aria-label="文章分类">
                        <button type="button" class="site-tab" :class="{ 'is-active': activeCategory === 'all' }"
                            @click="selectCategory('all')">全部</button>
                        <button v-for="cat in categories" :key="cat.key" type="button" class="site-tab"
                            :class="{ 'is-active': activeCategory === cat.key }" @click="selectCategory(cat.key)">
                            {{ cat.title }}
                        </button>
                    </nav>

                    <div class="site-search" role="search" aria-label="搜索文章">
                        <span class="site-search__icon" aria-hidden="true"></span>
                        <input id="site-article-search" v-model="searchQuery" type="text" inputmode="search"
                            enterkeyhint="search" class="site-search__input" placeholder="按标题筛选…" autocomplete="off"
                            spellcheck="false" aria-label="按文章标题搜索" />
                    </div>
                </div>
            </header>

            <div class="site-body">
                <main class="site-main">
                    <!-- 首页：按分类分节列表 -->
                    <div v-show="view === 'home'" class="home">
                        <p v-if="searchTrimmed && homeSections.length === 0" class="home-empty">
                            未找到匹配文章
                        </p>

                        <section v-for="cat in homeSections" :key="cat.key" class="home-section">
                            <h2 class="home-section__title">
                                {{ cat.title }}
                                <span class="home-section__count">{{ cat.total }}</span>
                            </h2>
                            <ul class="home-list">
                                <li v-for="it in cat.items" :key="it.href" class="home-list__item">
                                    <div class="home-card">
                                        <span class="home-card__tag">{{ cat.title }}</span>
                                        <a class="home-card__title" :href="'#/' + hrefToHash(it.href)"
                                            @click.prevent="openArticle(it.href)">{{ it.text }}</a>
                                        <p v-if="it.excerpt" class="home-card__excerpt">{{ it.excerpt }}</p>
                                        <a class="home-card__more" :href="'#/' + hrefToHash(it.href)"
                                            @click.prevent="openArticle(it.href)">阅读全文</a>
                                    </div>
                                </li>
                            </ul>
                            <button v-if="cat.hasMore" type="button" class="home-section__more"
                                @click="selectCategory(cat.key)">
                                查看全部 {{ cat.total }} 篇 →
                            </button>
                        </section>
                    </div>

                    <!-- 阅读态：同分类侧栏 + 正文 -->
                    <div v-show="view === 'article'" class="reader">
                        <aside class="sibling" aria-label="同分类文章">
                            <button type="button" class="sibling__back" @click="goHome">← 返回列表</button>
                            <p v-if="activeCategoryMeta" class="sibling__cat">{{ activeCategoryMeta.title }}</p>
                            <ul class="sibling__list">
                                <li v-for="it in siblingItems" :key="it.href">
                                    <a :href="'#/' + hrefToHash(it.href)"
                                        :class="{ active: activeHref === it.href }"
                                        @click.prevent="openArticle(it.href)">
                                        {{ it.text }}
                                    </a>
                                </li>
                            </ul>
                            <details class="sibling-mobile">
                                <summary>本分类文章</summary>
                                <ul class="sibling__list">
                                    <li v-for="it in siblingItems" :key="'m-' + it.href">
                                        <a :href="'#/' + hrefToHash(it.href)"
                                            :class="{ active: activeHref === it.href }"
                                            @click.prevent="openArticle(it.href)">
                                            {{ it.text }}
                                        </a>
                                    </li>
                                </ul>
                            </details>
                        </aside>

                        <div class="reader__content">
                            <div id="article" aria-live="polite"></div>
                        </div>
                    </div>
                </main>

                <aside class="contact-rail" aria-label="联系方式">
                    <div class="contact-rail__card contact-rail__wechat-personal">
                        <div class="contact-rail__row">
                            <span class="contact-rail__label">
                                <svg class="contact-rail__icon" viewBox="0 0 24 24" aria-hidden="true"
                                    fill="currentColor">
                                    <path
                                        d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.565l-.126.945a.59.59 0 0 0 .856.623l.78-.375a.59.59 0 0 1 .567-.006c.848.32 1.78.49 2.76.49.128 0 .254-.004.38-.012a5.85 5.85 0 0 1-.592-2.54c0-3.52 3.31-6.38 7.39-6.38.16 0 .318.006.475.016C18.84 5.98 14.69 2.188 8.691 2.188Zm-2.4 4.31a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Zm4.8 0a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Z" />
                                    <path
                                        d="M24 14.97c0-3.638-3.453-6.59-7.71-6.59-4.258 0-7.71 2.952-7.71 6.59 0 3.64 3.452 6.59 7.71 6.59.918 0 1.8-.158 2.598-.452a.59.59 0 0 1 .572.014l.69.355a.59.59 0 0 0 .857-.585l-.118-.886a.59.59 0 0 1 .222-.564A6.54 6.54 0 0 0 24 14.97Zm-10.84-1.22a.91.91 0 1 1 0 1.82.91.91 0 0 1 0-1.82Zm5.07 0a.91.91 0 1 1 0 1.82.91.91 0 0 1 0-1.82Z" />
                                </svg>
                                微信交流
                            </span>
                        </div>
                        <p class="contact-rail__personal-tip">添加微信，与我直接交流</p>
                        <div class="contact-rail__qr">
                            <img src="./images/writer-wechat.jpg" alt="个人微信二维码" decoding="async"
                                onerror="this.style.display='none'" />
                        </div>
                    </div>

                    <div class="contact-rail__card">
                        <div class="contact-rail__row">
                            <span class="contact-rail__label">
                                <svg class="contact-rail__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                    <polyline points="22,6 12,13 2,6" />
                                </svg>
                                邮箱
                            </span>
                            <span class="contact-rail__email-wrap">
                                <a class="contact-rail__link contact-rail__link--email"
                                    href="mailto:uriwang1986@gmail.com">uriwang1986@gmail.com</a>
                            </span>
                        </div>
                        <div class="contact-rail__row">
                            <span class="contact-rail__label">
                                <svg class="contact-rail__icon" viewBox="0 0 24 24" aria-hidden="true"
                                    fill="currentColor">
                                    <path
                                        d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                                </svg>
                                GitHub
                            </span>
                            <a class="contact-rail__link" href="https://github.com/os-artificer" target="_blank"
                                rel="noopener noreferrer">github.com/os-artificer</a>
                        </div>
                    </div>

                    <div class="contact-rail__wechat" role="button" tabindex="0"
                        aria-label="查看欢迎页面与公众号信息" @click="openArticle(welcomeHref)"
                        @keydown.enter.prevent="openArticle(welcomeHref)"
                        @keydown.space.prevent="openArticle(welcomeHref)">
                        <p class="contact-rail__welcome">欢迎关注订阅公众号：Artificer老王的学习笔记</p>
                        <div class="contact-rail__qr">
                            <picture>
                                <source srcset="./images/wechat-qrcode.webp" type="image/webp">
                                <img src="./images/wechat-qrcode.png" alt="公众号二维码" decoding="async" />
                            </picture>
                        </div>
                    </div>
                </aside>
            </div>

            <footer class="site-footer" aria-label="联系方式">
                <div class="site-footer__inner">
                    <div class="site-footer__qr">
                        <picture>
                            <source srcset="./images/wechat-qrcode.webp" type="image/webp">
                            <img src="./images/wechat-qrcode.png" alt="公众号二维码" decoding="async" />
                        </picture>
                    </div>
                    <div class="site-footer__meta">
                        <p>关注公众号：Artificer老王的学习笔记</p>
                        <p>
                            <a href="mailto:uriwang1986@gmail.com">uriwang1986@gmail.com</a>
                            ·
                            <a href="https://github.com/os-artificer" target="_blank"
                                rel="noopener noreferrer">GitHub</a>
                        </p>
                    </div>
                </div>
            </footer>
        </div>
    </template>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script src="./script/app.js?v=20260731d"></script>
</body>

</html>
